name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deployments touch a single production database. Never run two at once,
# and never cancel one midway: an interrupted migration is worse than a
# slow queue.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Required before the build: `npm run build` is a bare `tsc`, and on a
      # clean runner the generated Prisma client does not exist yet.
      - run: npx prisma generate

      - run: npm run lint
      - run: npm test
      - run: npm run build

  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
