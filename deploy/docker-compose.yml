# RIALA production stack, running on a SHARED server behind its own Traefik
# (container docuseal_traefik, configured only via a file provider — no Docker
# labels here do any routing). Canonical copy lives in this repo; the deploy
# workflow syncs it into the deploy directory on the server (the DEPLOY_DIR
# GitHub variable), next to its .env.
# The database does NOT live here: it is Neon, via DATABASE_URL in .env, and
# is never dockerized.
# This stack publishes NO public port — Traefik reaches these containers only
# over the shared docker network.
name: riala

services:
  nginx:
    image: ghcr.io/rocobytes/riala-frontend:${RIALA_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      riala: {}
      proxy:
        aliases: [riala-web]

  backend:
    image: ghcr.io/rocobytes/riala-backend:${RIALA_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    # Localhost-only: the host crontab's check-alertas call reaches the
    # backend here without the secret transiting the internet or nginx.
    # The backend is NOT reachable publicly; nginx reaches it over the
    # internal riala network. Port 3001 on the host belongs to another
    # project (uptime-kuma), hence 3101 here.
    ports:
      - "127.0.0.1:3101:3001"
    # The backend never writes to disk (uploads stream to Google Cloud
    # Storage).
    read_only: true
    tmpfs: [/tmp]
    # Backend never joins the proxy network: nginx is the only container
    # Traefik/other projects can see, the backend stays internal-only.
    networks:
      riala:
        aliases: [riala-backend]

  # One-shot migrations. Never starts with `up -d` (gated by profile).
  # The deploy runs it explicitly: docker compose run --rm migrate
  migrate:
    image: ghcr.io/rocobytes/riala-backend:${RIALA_TAG:-latest}
    profiles: [ops]
    env_file: .env
    command: ["npx", "prisma", "migrate", "deploy"]
    networks: [riala]

# Exactly ONE backend replica, always: the rate limiting is in memory.
networks:
  riala: {}
  proxy:
    external: true
    name: docuseal_docuseal-net
