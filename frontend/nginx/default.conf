# nginx of the frontend container: serves the SPA and proxies /api.
# It runs behind the shared server's Traefik (container docuseal_traefik),
# which terminates TLS with Let's Encrypt and forwards plain HTTP to this
# container over the Docker network, addressed by its alias `riala-web`.
# This container never terminates TLS and publishes no host port.

# Default server on port 80: absorbs any Host that is not ours, so this
# container never serves a domain that belongs to another project on the
# shared network.
# /healthz lives here because Docker's HEALTHCHECK hits
# http://127.0.0.1/healthz, whose Host does not match any server_name;
# without this the container stays unhealthy and the backend's
# depends_on: service_healthy takes down the whole stack.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

# www redirect.
server {
    listen 80;
    server_name www.riala.cl;

    location / {
        return 301 https://riala.cl$request_uri;
    }
}

server {
    listen 80;
    server_name riala.cl;

    # Real client IP: only containers on the Docker networks can reach this
    # nginx (no published host port), so Traefik is always the direct peer.
    # With real_ip_recursive off, nginx takes the LAST X-Forwarded-For entry,
    # which is the one Traefik writes for the address it saw; a value forged
    # by the client can only ever appear before it, so it is never picked.
    # Trusting all private ranges (rather than one fixed Traefik IP) means
    # this keeps working if the Docker network is re-created with a new
    # subnet.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    root  /usr/share/nginx/html;
    index index.html;

    # The backend limits GPX files to 15MB; margin for multipart overhead.
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # No URI at the end of proxy_pass -> the /api prefix is preserved
        # (Express mounts the router on /api).
        proxy_pass http://riala-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # After real_ip above, $remote_addr is already the real client IP,
        # not Traefik's. Forward it as-is: with app.set('trust proxy', 1)
        # Express reads the last X-Forwarded-For entry, so express-rate-limit
        # buckets by the real client. Using $proxy_add_x_forwarded_for here
        # instead would append to whatever header Traefik forwarded and make
        # the backend see Traefik's own IP as the last entry, bucketing every
        # user behind it into a single rate-limit bucket.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Traefik redirects all HTTP to HTTPS, so any traffic that reaches
        # this container was HTTPS on the wire.
        proxy_set_header X-Forwarded-Proto https;

        # Preserve the busboy -> Google Cloud Storage streaming: do not
        # buffer uploads to disk or cut off slow uploads from the mountain.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite emits content-hashed filenames -> immutable cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback (replaces the rewrite from frontend/vercel.json).
    # Security headers only here: helmet sets them on /api, and /assets are
    # static hashed files.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
