# nginx del contenedor frontend: sirve el SPA, termina TLS y proxea /api.
# El tráfico real llega SIEMPRE por 443 vía Cloudflare (proxy naranja,
# modo Full (strict) + "Always Use HTTPS").

# Servidor por defecto en el puerto 80: absorbe todo Host que no sea el
# nuestro, para que este contenedor nunca sirva un dominio ajeno.
# /healthz vive aquí porque el HEALTHCHECK de Docker entra por
# http://127.0.0.1/healthz, cuyo Host no coincide con ningún server_name;
# sin esto el contenedor queda unhealthy y el depends_on: service_healthy
# del backend se lleva abajo todo el stack.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

# Servidor por defecto en el puerto 443: rechaza el handshake TLS de
# cualquier SNI que no sea el nuestro, en vez de presentar un certificado
# emitido para otro dominio.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# Puerto 80: healthcheck de Docker + redirección de respaldo.
server {
    listen 80;
    server_name andinoclubpamir.app www.andinoclubpamir.app;

    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 301 https://andinoclubpamir.app$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name andinoclubpamir.app www.andinoclubpamir.app;

    # Certificado de origen de Cloudflare (bind-mount desde /opt/pamir/certs
    # en el host; rotarlo nunca requiere reconstruir la imagen).
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /usr/share/nginx/html;
    index index.html;

    # El backend limita los GPX a 15MB; margen para el overhead multipart.
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # Sin URI al final del proxy_pass → el prefijo /api se conserva
        # (Express monta el router en /api).
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # CRÍTICO: reenviar la IP real del cliente desde Cloudflare.
        # Con app.set('trust proxy', 1) Express lee la última entrada de XFF,
        # así express-rate-limit limita por cliente real y no por IP de borde
        # de Cloudflare (que agruparía a todo el club en un solo bucket).
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;

        # Preservar el streaming busboy → Google Cloud Storage: no bufferizar
        # las subidas a disco ni cortar uploads lentos desde la montaña.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite emite nombres con hash de contenido → cache inmutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback del SPA (reemplaza el rewrite de frontend/vercel.json).
    # Headers de seguridad solo aquí: en /api los pone helmet, y /assets
    # son archivos estáticos con hash.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
